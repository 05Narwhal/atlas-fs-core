[package]
name = "atlas-fs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Core traits and types for reading filesystems and disk images: BlockSource, FileSystem, DirStream and one error type."
repository = "https://github.com/05Narwhal/atlas-fs-core"
homepage = "https://julianloy.com"
readme = "README.md"
keywords = ["filesystem", "disk", "block-device", "parser", "forensics"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[dependencies]
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
